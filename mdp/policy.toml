format = 1

# Product trust/placement policy. Build commands live in producer repositories.
[producers.kernel]
boot = ["system/kernel.elf", "system/kernel.meta"]
symbols = ["kernel.debug"]
[producers.boot]
boot = ["EFI/BOOT/BOOTX64.EFI"]
initfs = ["config/kernel.conf"]
host-tools = ["boot-selection-seed", "boot-selection-confirm-test", "boot-selection-gpt-probe", "system-image-sign", "system-slot-image"]
[producers.runtime]
system = ["bin/hello"]
sdk = ["native"]
[producers.fonts]
system = ["libraries/fonts"]
[producers.services]
system = ["services"]
initfs = ["init"]
manifests = [""]
metadata = ["services.json"]
[producers.drivers]
system = ["bin/drivers"]
manifests = ["drivers"]
metadata = ["drivers.json"]
[producers.cexts]
initfs = ["disk.cext"]
[producers.msh]
system = ["bin/msh", "resources/msh"]
manifests = ["msh.toml"]
metadata = ["msh.json"]
[producers.coreutils]
system = ["bin"]
manifests = ["coreutils.toml"]
metadata = ["coreutils.json"]
[producers.viewkit]
sdk-framework = ["libviewkit.rlib"]
[producers.devkit-host]
host-tools = ["msign", "mpack"]
[producers.devkit-native]
system = ["developer", "bin", "share"]
sdk-framework = ["libappcore.rlib"]
manifests = ["development-tools.toml", "vim.toml"]
metadata = ["devkit-native.json"]
[producers.shared-sdk]
sdk-shared = ["sdk"]
[producers.system-components]
system = ["libraries", "share/licenses"]
manifests = ["org.mochios.webkit.toml", "components.json"]
metadata = ["system-components.json"]
[producers.image-data]
system = ["libraries/ime"]

# Applications are package inputs, not authority to modify System arbitrarily.
[application]
applications = [""]
metadata = [""]
[producers.app-installer]
applications = ["installer.mpkg"]
system = ["resources/legal"]
metadata = ["app-installer.json"]

[producers.mboot]
hardware-media = ["mochiOS.img"]

[producers.boot-hardware]
hardware-domains = ["mochios-system"]

[producers.std-demo]
system = ["bin/rust-std-demo"]
manifests = ["rust-std-demo.toml"]
metadata = ["std-demo.json"]

# Optional build-host tools never become OS payloads.
[producers.mdp]
development-host = ["mdp"]
[producers.mdev]
development-host = ["mdev"]
[producers.mws]
development-host = ["mws"]
[producers.mmake]
development-host = ["mmake"]
