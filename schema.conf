menu "Applications"
bool APPLICATION_TERRA_BUILTIN "Include Terra (browser)" n
help "Embed the native Terra MPKG for development/testing. WebKit is always included in System. Leave disabled for AppStore delivery in release images."
bool APPLICATION_EDIT_BUILTIN "Include Edit" n
help "Embed Edit in System instead of relying on AppStore delivery. Requires the app-edit MDP artifact."
bool APPLICATION_CALENDAR_BUILTIN "Include Calendar" n
help "Embed Calendar in System. Leave disabled to obtain it through AppStore. Requires the app-calendar MDP artifact."
bool APPLICATION_MAIL_BUILTIN "Include Mail" n
help "Embed Mail in System. Leave disabled to obtain it through AppStore. Requires the app-mail MDP artifact."
bool APPLICATION_CALCULATOR_BUILTIN "Include Calculator" n
help "Embed Calculator in System. Leave disabled to obtain it through AppStore. Requires the app-calculator MDP artifact."
endmenu

menu "Drivers"
bool DRIVER_XHCI "USB xHCI input driver" y
help "Build and include the xHCI driver through its MDP producer. Needed for supported USB input devices; does not enable unsupported USB device classes."
bool DRIVER_I8042 "PS/2 i8042 input driver" y
help "Build and include legacy PS/2 keyboard and mouse support. Keep enabled for VM or hardware configurations that use i8042 input."
bool DRIVER_VIRTIO_NET "Virtio network driver" y
help "Build and include the Virtio network driver. Needed for networking with the current QEMU Virtio network device."
endmenu

menu "Development"
bool USER_BUILD_SELFTESTS "Include userland selftests" y
help "Control the selftest utilities selected by the userland producer and registered in the System coreutils package. Rebuild MDP inputs after changing."
bool KERNEL_PERFORMANCE_INSTRUMENTATION "Kernel performance instrumentation" n
help "Enable the kernel performance-instrumentation feature and the matching mperf utility registration. Requires rebuilt kernel and coreutils artifacts."
bool USER_INSTALL_DEVELOPER_TOOLS "Include native C/C++ development tools" n
help "Include the devkit-native payload (Clang, LLD, ld and msign) in System. Requires its separately built MDP artifact and substantially more disk space."
string USER_DEVELOPER_TOOLS_JOBS "Native development tools build jobs" "2"
help "Positive number of parallel jobs for building native development tools. This does not set the global MDP workspace job count."
string KERNEL_RUST_TOOLCHAIN "Kernel / service Rust toolchain" "nightly-2026-05-14"
help "Toolchain used by the kernel and native service/driver producers. Changing this value does not install it; install the toolchain before building producers."
bool DEVELOPMENT_DEFAULT_ACCOUNT "Create development testuser and auto-login" n
help "Create the development testuser account and automatic login settings in the image. Keep disabled for release images."
endmenu

menu "Boot and trust"
bool REQUIRE_UEFI_SECURE_BOOT "Require UEFI Secure Boot" y
help "Require Secure Boot before loading an OS slot in the existing boot verification path. Disabling this changes the boot trust policy."
bool DEVELOPMENT_SYSTEM_SIGNATURES "Trust development System signing key" n
help "Include trust for the repository development System key in boot/System image generation. Development only; keep disabled for release images."
bool DEVELOPMENT_UEFI_SIGNING "Sign mBoot with OVMF development key" n
help "Use the local OVMF development certificate instead of MOCHIOS_UEFI_SIGNING_KEY and MOCHIOS_UEFI_SIGNING_CERT. Development only; does not publish keys or releases."
endmenu

menu "Image layout"
string IMAGE_DISK_SIZE_MB "Disk capacity (MiB)" "1024"
help "Positive initial disk capacity used by image assembly. Must leave enough space for ESP, Data and the actual System payload."
string IMAGE_ESP_SIZE_MB "EFI System Partition capacity (MiB)" "192"
help "Positive initial ESP capacity for boot files and modules. Applies when generating images, not to existing VM disks."
string IMAGE_DATA_SIZE_MB "Data partition capacity (MiB)" "128"
help "Positive initial Data partition capacity. Keep enough space for user files and AppStore packages."
string IMAGE_INITFS_SIZE_MB "Initial initfs capacity (MiB)" "96"
help "Positive initial initfs image capacity. Payload policy remains limited to core, boot configuration and required disk cext; this does not add components."
endmenu

menu "VM launch defaults"
bool DEBUG_QEMU_GUI "Show VM display window" y
help "Runner default for GUI display. mdev environment overrides take precedence; this does not modify the guest System image."
bool DEBUG_QEMU_KVM "Use KVM acceleration when available" n
help "Request the runner KVM path. Host virtualization support and permissions are still required; mdev environment overrides take precedence."
bool DEBUG_QEMU_GPU_BACKEND "Enable Virgl GPU backend" y
help "Select the existing Virgl graphics path instead of the 2D backend. Requires suitable host QEMU, GL and render-node support."
string DEBUG_QEMU_CPU "QEMU CPU model" "qemu64"
help "CPU model passed to the existing runner. The available models depend on the host QEMU build. An mdev environment override can replace this value."
string DEBUG_QEMU_SMP "Virtual CPU count" "2"
help "Positive number of VM CPUs. This controls QEMU topology, not kernel SMP compilation. An mdev environment override can replace this value."
bool DEBUG_QEMU_DEBUG "Wait for GDB at startup" n
help "Run QEMU with -s -S: the VM waits for a debugger before executing. Connect to the GDB server before expecting boot progress."
endmenu
